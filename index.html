<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}</style>
<script>
window.DB_URL="https://gonggam-board-default-rtdb.asia-southeast1.firebasedatabase.app";
</script>
<title>공감온도계 의견판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: single column phone-first. Form on top, live board below, filter by card. */
:root{
--bg:#fbf3f8; --surface:#ffffff; --fg:#2d2740; --muted:#6f6888; --line:#e3dcef;
--accent:#7a5cd6; --accent-fg:#ffffff; --cold:#4f8fd8; --hot:#e8704f; --soft:#efe9fb;
--font-d:'Jua','Noto Sans KR',sans-serif; --font-b:'Noto Sans KR',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#17141f; --surface:#221e2e; --fg:#f0ecfa; --muted:#a9a1c2; --line:#383250;
--accent:#a68cf5; --accent-fg:#1a1428; --cold:#7db1f0; --hot:#f2916f; --soft:#2e2745; color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#17141f; --surface:#221e2e; --fg:#f0ecfa; --muted:#a9a1c2; --line:#383250;
--accent:#a68cf5; --accent-fg:#1a1428; --cold:#7db1f0; --hot:#f2916f; --soft:#2e2745; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:16px;line-height:1.5;
padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--font-d);font-weight:400;font-size:30px;color:var(--accent);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}
.panel{background:var(--surface);border:2px dashed var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:16px}
label,.lab{font-weight:700;font-size:14px;display:block;margin-bottom:6px}
input[type=text],textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:11px 14px}
textarea{resize:vertical;min-height:84px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1 1 0;min-width:52px;font:inherit;font-size:20px;font-weight:700;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:10px 0;cursor:pointer;transition:transform .12s}
.chip:active{transform:scale(.94)}
.cc{--c:#5FBF92;--ct:#fff;background:color-mix(in srgb,var(--c) 20%,var(--bg));border-color:var(--c)}
.cc[data-n="2"]{--c:#F5B642;--ct:#3a3547}.cc[data-n="3"]{--c:#8E7CDB}.cc[data-n="4"]{--c:#F27D6B}
.cc[aria-pressed=true]{background:var(--c);color:var(--ct);border-color:var(--c)}
.tag.cc{border:0;color:var(--fg);font-weight:700;background:color-mix(in srgb,var(--c) 28%,var(--surface))}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.scale{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:6px}
.namerow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between}
.blk{display:flex;flex-direction:column;gap:6px;min-width:0}.blk .lab,.blk label{margin:0}
.nb{align-items:flex-start}.nb input{width:104px;padding:10px}
.pb{align-items:flex-end;margin-left:auto;flex:1 1 220px}
.pick{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.pk{width:40px;height:40px;border-radius:50%;padding:0;background:var(--soft);border:2.5px solid transparent;cursor:pointer;display:grid;place-items:center;opacity:.6;transition:transform .12s}
.pk img{width:32px;height:32px}
.pk[aria-pressed=true]{opacity:1;border-color:var(--accent);transform:scale(1.1)}
.pk:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.heart{color:#f27d6b;margin-right:2px}
.panel{border:0;background:transparent;padding:0;gap:12px}
.row2{display:flex;flex-wrap:wrap;gap:12px}
.sec{--c:#8E7CDB;background:color-mix(in srgb,var(--c) 14%,var(--surface));border:2px solid color-mix(in srgb,var(--c) 50%,var(--surface));border-radius:22px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sec .pill{align-self:flex-start;background:var(--c);color:#fff;font-family:var(--font-d);font-size:16px;line-height:1;padding:7px 14px;border-radius:999px;margin:0;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.sec input[type=text],.sec textarea{background:var(--surface);border:2.5px solid color-mix(in srgb,var(--c) 55%,var(--surface));font-size:17px}
.sec input[type=text]{width:100%}
.sec .labrow{margin:0}
.sec .pick{justify-content:flex-start}
.sec .pk{background:var(--surface)}
.sec .scale{margin-top:0}
.labrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin-bottom:6px}.labrow .lab{margin:0}
.hint{font-size:12px;color:var(--muted)}
.thermos{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding-top:6px}
.th{font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 0 4px;background:none;border:0;cursor:pointer;color:var(--fg);opacity:.5;transition:transform .15s,opacity .15s}
.th svg{width:34px;height:78px;display:block;overflow:visible}
.th b{font-family:var(--font-d);font-weight:400;font-size:16px;min-width:26px;height:26px;line-height:26px;border-radius:50%;text-align:center}
.th[aria-pressed=true]{opacity:1;transform:translateY(-4px) scale(1.12)}
.th[aria-pressed=true] b{color:#fff;background:var(--lc)}
.th:active{transform:scale(.92)}
.th:focus-visible{border-radius:12px}
.tube{fill:var(--surface);stroke:var(--muted)}
.scale span:first-child{color:var(--cold)} .scale span:last-child{color:var(--hot)}
.send{font:inherit;font-family:var(--font-d);font-size:18px;background:var(--accent);color:var(--accent-fg);border:0;border-radius:999px;padding:13px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .12s}
.send:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.send:disabled{opacity:.5;cursor:default}
.msg{font-size:14px;min-height:20px;margin:0}
.msg.err{color:var(--hot)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:inherit;font-size:14px;font-weight:500;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.tab[aria-pressed=true]{background:var(--soft);border-color:var(--accent);font-weight:700}
.stat{color:var(--muted);font-size:14px;margin:0}
.stat b{color:var(--fg);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.item{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;min-width:0}
.av{grid-row:span 2;position:relative;width:52px;height:52px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.av img{width:42px;height:42px}
.score{position:absolute;right:-6px;bottom:-6px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-d);font-size:14px;color:#fff;border:2px solid var(--surface);font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:12px}
.pets{display:flex;gap:2px;margin-left:auto;flex-shrink:0}
.pets img{width:30px;height:30px;animation:hop 2.4s ease-in-out infinite}
.pets img:nth-child(2n){animation-delay:.4s}.pets img:nth-child(3n){animation-delay:.9s}
@keyframes hop{0%,70%,100%{transform:translateY(0)}85%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.pets img{animation:none}}
@media (max-width:420px){.pets img:nth-child(n+4){display:none}}
.head{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;min-width:0}
.name{font-weight:700}.tag{font-size:12px;color:var(--muted);background:var(--soft);border-radius:999px;padding:1px 8px}
.txt{margin:0;overflow-wrap:anywhere;min-width:0}
.del{font:inherit;font-size:12px;color:var(--muted);background:none;border:0;cursor:pointer;justify-self:start;padding:0;text-decoration:underline}
.empty{color:var(--muted);text-align:center;padding:24px 8px;border:2px dashed var(--line);border-radius:20px;margin:0}
</style>
<div class="wrap">
<header>
<div class="top"><h1>공감온도계 의견판</h1><div class="pets" id="pets" aria-hidden="true"></div></div>
<p class="sub">같은 상황, 다른 마음. 내 생각을 남기고 친구들 생각도 읽어 봐요.</p>
</header>
<form class="panel" id="f" autocomplete="off">
<div class="row2">
<div class="sec" style="--c:#5AAEE6;flex:0 1 150px"><label class="pill" for="name">내 이름</label><input type="text" id="name" maxlength="12" placeholder="이름 쓰기"></div>
<div class="sec" style="--c:#F5B642;flex:1 1 230px"><span class="pill">내 캐릭터</span><div class="pick" id="petPick" role="group" aria-label="캐릭터 고르기"></div></div>
</div>
<div class="sec" style="--c:#8E7CDB"><span class="pill">상황 카드 번호</span>
<div class="chips" id="cardChips"></div></div>
<div class="sec" style="--c:#F27D6B"><div class="labrow"><span class="pill">공감 온도 점수</span><span class="hint"><span class="heart" aria-hidden="true">♥</span> 내 기분이 아니라 카드 속 인물의 마음이에요.</span></div>
<div class="chips" id="scoreChips"></div>
<div class="scale"><span>거의 힘들지 않아요</span><span>매우 힘들어요</span></div></div>
<div class="sec" style="--c:#5FBF92"><label class="pill" for="text">한 줄 의견</label><textarea id="text" maxlength="100" placeholder="그렇게 생각한 이유를 한 줄로 써 주세요"></textarea></div>
<button class="send" id="send" type="submit">의견 올리기</button>
<p class="msg" id="msg" role="status"></p>
</form>
<section style="display:flex;flex-direction:column;gap:12px" aria-label="친구들 의견">
<div class="tabs" id="tabs"></div>
<p class="stat" id="stat"></p>
<ul class="list" id="list"></ul>
<p class="empty" id="empty">불러오는 중이에요.</p>
</section>
</div>

var CARDS=[1,2,3,4], state={pet:+ls('gg-pet')||0,card:null,score:null,filter:0,rows:[],loaded:false}, admin=false, busy=false, DB=(window.DB_URL||'').replace(/\/+$/,'');
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
$('name').value=ls('gg-name')||'';
function chips(id,vals,key,fmt){
var box=$(id);
vals.forEach(function(v){
var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=fmt(v);b.setAttribute('aria-pressed','false');if(key==='card'){b.classList.add('cc');b.dataset.n=v}
b.onclick=function(){state[key]=v;[].forEach.call(box.children,function(c){c.setAttribute('aria-pressed',c===b?'true':'false')})};
box.appendChild(b)});
}
var CIR=['','①','②','③','④'];
chips('cardChips',CARDS,'card',function(v){return CIR[v]});
var LV=['#7EC8E3','#8FD9A8','#FFD966','#FFA85C','#FF6B6B'], LVD=['#4FA9CB','#5DBF83','#E8B930','#F58B35','#EB4B4B'];
(function(){
var box=$('scoreChips');box.className='thermos';
for(var v=1;v<=5;v++)(function(v){
var b=document.createElement('button');b.type='button';b.className='th';b.setAttribute('aria-pressed','false');
b.setAttribute('aria-label',v+'점');
var fr=0.18+0.205*(v-1), top=50-fr*46; b.style.setProperty('--lc',LVD[v-1]);
b.innerHTML='<svg viewBox="0 0 28 64" aria-hidden="true"><rect class="tube" x="9" y="2" width="10" height="46" rx="5" stroke-width="2"/><rect x="11.5" y="'+top+'" width="5" height="'+(52-top)+'" rx="2.5" fill="'+LV[v-1]+'"/><circle cx="14" cy="53" r="9" fill="'+LV[v-1]+'" stroke="var(--surface)" stroke-width="2"/></svg><b>'+v+'</b>';
b.onclick=function(){state.score=v;[].forEach.call(box.children,function(c){c.setAttribute('aria-pressed',c===b?'true':'false')})};
box.appendChild(b)})(v);
})();
function tabs(){
var t=$('tabs');t.textContent='';
[0].concat(CARDS).forEach(function(c){
var b=document.createElement('button');b.type='button';b.className='tab';b.textContent=c?CIR[c]+' 카드':'전체';
b.setAttribute('aria-pressed',state.filter===c?'true':'false');
b.onclick=function(){state.filter=c;tabs();render()};t.appendChild(b)});
}
function pet(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;return PETS[h%PETS.length]}

b.onclick=function(){state.pet=i+1;ls('gg-pet',String(i+1));pickPets()};box.appendChild(b)})}
pickPets();
function color(s){return LVD[s-1]||LVD[2]}
function render(){

var n=document.createElement('span');n.className='name';n.textContent=r.name;

li.appendChild(document.createElement('span'));li.appendChild(d)}
ul.appendChild(li)});
$('stat').innerHTML='';
if(rows.length){
var a=document.createElement('span');a.textContent='의견 ';var b1=document.createElement('b');b1.textContent=rows.length+'개';
var c=document.createElement('span');c.textContent=' · 평균 점수 ';var b2=document.createElement('b');b2.textContent=(sum/rows.length).toFixed(1);
[a,b1,c,b2].forEach(function(x){$('stat').appendChild(x)})}
var e=$('empty');
e.hidden=rows.length>0;
e.textContent=state.loaded?'아직 올라온 의견이 없어요. 첫 번째로 남겨 보세요!':'불러오는 중이에요.';
}
function say(t,err){var m=$('msg');m.textContent=t;m.className='msg'+(err?' err':'')}
$('f').addEventListener('submit',function(ev){
ev.preventDefault();
if(busy)return;
var name=$('name').value.trim(),text=$('text').value.trim();
if(!name)return say('이름을 써 주세요.',1);
if(!state.pet)return say('나의 캐릭터를 골라 주세요.',1);
if(!state.card)return say('상황 카드 번호를 골라 주세요.',1);
if(!state.score)return say('점수를 골라 주세요.',1);
if(!text)return say('한 줄 의견을 써 주세요.',1);
if(!DB)return say('아직 저장소 주소가 설정되지 않았어요. 선생님께 알려 주세요.',1);
busy=true;$('send').disabled=true;
ls('gg-name',name);
var rec={name:name,pet:state.pet,card:state.card,score:state.score,text:text,ts:Date.now()};
fetch(DB+'/entries.json',{method:'POST',body:JSON.stringify(rec)})
.then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json()})
.then(function(o){rec.id=o.name;state.rows.unshift(rec);state.loaded=true;render();say('올렸어요! 친구들 의견도 읽어 보세요.');$('text').value=''})
.catch(function(){say('올리지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.',1)})
.then(function(){busy=false;$('send').disabled=false});
});
function norm(x,id){return {id:id,ts:+x.ts||0,pet:+x.pet||0,name:String(x.name||'').slice(0,12),card:Math.min(4,Math.max(1,+x.card||1)),score:Math.min(5,Math.max(1,+x.score||3)),text:String(x.text||'').slice(0,100)}}
function load(){
if(!DB){$('empty').hidden=false;$('empty').textContent='저장소 주소가 아직 없어요. 파일 위쪽 DB_URL에 주소를 넣어 주세요.';return}
if(document.hidden){setTimeout(load,3000);return}
fetch(DB+'/entries.json').then(function(r){if(!r.ok)throw new Error();return r.json()}).then(function(o){
state.loaded=true;
state.rows=Object.keys(o||{}).map(function(k){return norm(o[k]||{},k)}).sort(function(a,b){return b.ts-a.ts}).slice(0,500);
render();
}).catch(function(){if(!state.loaded){$('empty').hidden=false;$('empty').textContent='의견을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'}})
.then(function(){setTimeout(load,4000)});
}
tabs();render();load();
})();
</script>
